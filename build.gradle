plugins {
	id "me.champeau.jmh" version "0.7.3"
    id 'java-library'
    id 'idea'
    id 'eclipse'
}

compileJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
    maven {
    	name = 'Maven Central Snapshots' 
        url = 'https://central.sonatype.com/repository/maven-snapshots/' 
    }
}

dependencies {
	implementation 'com.google.code.gson:gson:2.14.0'
	implementation "org.joml:joml:${JOML_VERSION}"
	implementation "org.joml:joml2-fields:${JOML2_VERSION}"
	implementation 'com.github.oshi:oshi-core:6.6.1'
}

jmh {
	includes = [
//		'benchmark\\.*'
//		'benchmark\\.joml\\.*'
//		'benchmark\\.joml2_fields\\.*'
	]
	humanOutputFile = null
    resultFormat = 'json'
    
    warmupIterations = 2
    iterations = 5
    timeOnIteration = '2s'
    warmup = '3s'
    fork = 1
    operationsPerInvocation = 5
    threads = 1
}

tasks.named('jmh') {
    finalizedBy('generateMarkdownResults')
}

task generateMarkdownResults(type: JavaExec) {
	group = 'internal'
	description = 'Processes the Json Results into a markdown file'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'jomlbench.BenchmarkFormatter'
    args = ['build/results/jmh/results.json', 'results/temp', 'results/output/Benchmark.md']
}